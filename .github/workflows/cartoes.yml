name: Cartões do perfil

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "gerar/**"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar cartões
        run: node gerar/gerar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || (git commit -m "Atualiza cartões" && git push)
